# usage-dashboard용 nginx 사이트 (/etc/nginx/sites-available/usage-dashboard)
# 같은 nginx에 다른 서비스가 추가될 수 있어 default_server 외의 catch-all은 두지 않아요.
# 포트 매핑: dev 8787 / prod 8788
# 확인: nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name usage-dashboard.velar-agent.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name usage-dashboard-dev.velar-agent.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}

# bare IP / unknown 호스트용: dev(8787)로 보내요
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
