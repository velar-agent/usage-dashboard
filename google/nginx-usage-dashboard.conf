# usage-dashboard용 nginx 사이트 (/etc/nginx/sites-available/usage-dashboard)
# 같은 nginx에 다른 서비스가 추가될 수 있어 default_server 외의 catch-all은 두지 않아요.
# 포트 매핑: dev 8787 / prod 8788
# https: Let's Encrypt 인증서 /etc/letsencrypt/live/usage-dashboard (certbot.timer 자동 갱신)
# 확인: nginx -t && sudo systemctl reload nginx

# 도메인 http -> https
server {
    listen 80;
    listen [::]:80;
    server_name usage-dashboard.velar-agent.duckdns.org usage-dashboard-dev.velar-agent.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usage-dashboard.velar-agent.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/usage-dashboard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usage-dashboard/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usage-dashboard-dev.velar-agent.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/usage-dashboard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usage-dashboard/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# bare IP / unknown 호스트용: API는 plain http로 절대 안 보내요 — /api/는 403, 나머지는 dev https로 301이에요
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /api/ {
        return 403;
    }

    location / {
        return 301 https://usage-dashboard-dev.velar-agent.duckdns.org$request_uri;
    }
}
